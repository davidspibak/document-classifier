# Central configuration - all paths are local; nothing here should ever be a URL
# that requires network access at runtime.

models:
  embedding: "./models/bge-m3"
  reranker: "./models/bge-reranker-v2-m3"
  # The logical single-file name. Qwen publishes this quantization SPLIT into
  # shards (qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf), so this exact file
  # may not exist on disk — llm/local_llm.py's resolve_gguf_path() finds the first
  # shard and llama.cpp loads the rest. Works unchanged for either layout.
  llm_gguf: "./models/qwen2.5-7b-instruct-q4_k_m.gguf"
  lang_id: "./models/lid.176.bin"

storage:
  sqlite_path: "./data/sqlite/app.db"
  lancedb_path: "./data/lancedb"
  inbox_dir: "./data/inbox"
  raw_dir: "./data/raw"

chunking:
  chunk_size_tokens: 400
  chunk_overlap_tokens: 50

classification:
  auto_assign_threshold: 0.72      # cosine similarity cutoff for auto-assign
  ambiguous_gap_threshold: 0.05    # min gap between top-1 and top-2 to avoid escalation
  llm_candidate_count: 5           # how many top categories to hand the LLM tie-breaker

search:
  ann_candidate_count: 50
  final_result_count: 10

# Metadata extraction during ingestion (title/authors/keywords/date).
# Each LLM-backed step costs a generation call per document, so a
# multi-million-document bulk run can switch the expensive parts off here
# without touching code.
metadata:
  enabled: true
  use_grobid: true            # try local GROBID first for PDFs (scholarly formatting)
  use_llm_fallback: true      # local LLM header extraction when GROBID is absent/fails
  extract_keywords: true      # KeyBERT keywords when the document lists none
  translate_to_english: true  # populate the *_en mirror fields for non-English documents
  llm_snippet_chars: 3000     # how much of the document head the LLM extractor sees

report:
  output_language: "en"
  samples_per_category: 8

ocr:
  confidence_flag_threshold: 60    # below this, flag document for human review
  # EasyOCR (the fallback for pages Tesseract read poorly) keeps its weights in
  # ~/.EasyOCR by default and downloads them from GitHub on first use. Both are
  # wrong for an offline app, so the weights live inside models/ and downloads are
  # off. Populate with: python scripts/fetch_models.py --only easyocr
  # If the weights are absent, OCR keeps the Tesseract result rather than failing.
  easyocr_model_dir: "./models/easyocr"
  easyocr_allow_download: false

# Hard-enforces offline operation by setting HF_HUB_OFFLINE / TRANSFORMERS_OFFLINE
# at package import (see src/docclassify/__init__.py). With this on, any dependency
# that tries to reach the Hugging Face Hub fails immediately and visibly instead of
# quietly downloading a model mid-run. Turn it off only if you intend to download.
offline:
  enforce: true
